[base]
package = ocean
env_name = puffer_poker
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 1  # Use single process for GPU optimization testing
backend = Serial

[env]
num_envs = 8192  # Large batch size optimizes GPU utilization for opponent model inference
render_mode = None
width = 1000
height = 750
starting_stack = 200
small_blind = 1
big_blind = 2
self_play_mode = true
generation_number = 1
opponent_generation = 0
max_episode_length = 50000
max_hands_per_episode = 200
report_interval = 128

[policy]
hidden_size = 64

[rnn]
input_size = 64
hidden_size = 64

[train]
total_timesteps = 100_000_000
batch_size = auto
minibatch_size = 65536
vf_coef= 1.0
adam_eps= 1e-8
ent_coef= 0.01
anneal_lr= true
clip_coef= 0.1
optimizer= adam
precision= float32
adam_beta1= 0.9
adam_beta2= 0.999
gae_lambda= 0.95
prio_alpha= 0.8499999999999999
prio_beta0= 0.8499999999999999
bptt_horizon= 64
entropy_coef= 0.01
vf_clip_coef= 0.1
learning_rate= 0.0003
compile_mode= max-autotune-no-cudagraphs
max_grad_norm= 0.5
update_epochs= 3
vtrace_c_clip= 1
vtrace_rho_clip= 1
compile_fullgraph= true
max_minibatch_size= 65536
checkpoint_interval= 200
torch_deterministic= True
gamma=.995

[sweep]
metric = bb_per_100
goal = maximize
method = Protein