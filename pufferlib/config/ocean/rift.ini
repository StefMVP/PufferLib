[base]
package = ocean
env_name = puffer_rift
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 8

[env]
num_envs = 1024
width = 1024
height = 768
cell_size = 32
completion_reward = 50.0
monster_kill_reward = 10.0
death_penalty = 0.0
episode_length_limit = 12000
town_stat_increase_reward = 1.0
town_ilvl_increase_reward = 2.0
town_stat_decrease_penalty = -1.0
town_ilvl_decrease_penalty = -2.0
town_no_purchases_penalty = -5.0
low_health_penalty = -2.0

[policy]
hidden_size = 32

[rnn]
input_size = 32
hidden_size = 32

[train]
total_timesteps = 400_000_000
vf_coef = 2
adam_eps = 1e-8
ent_coef = 0.01
anneal_lr = true
clip_coef = 0.2
optimizer = muon
precision = float32
adam_beta1 = 0.9
adam_beta2 = 0.999
batch_size = auto
gae_lambda = 0.95
prio_alpha = 0.85
prio_beta0 = 0.85
bptt_horizon = 64
entropy_coef = 0.1
vf_clip_coef = 0.2
learning_rate = 0.01
compile_mode = max-autotune-no-cudagraphs
max_grad_norm = 1
update_epochs = 4
vtrace_c_clip = 1
minibatch_size = 131072
vtrace_rho_clip = 1
compile_fullgraph = true
max_minibatch_size = 131072
checkpoint_interval = 100
torch_deterministic = True
gamma = 0.98

[sweep]
metric = rift_completions
goal = maximize
method = Protein

[sweep.train.total_timesteps]
distribution = log_normal
min = 200_000_000
max = 800_000_000
mean = 400_000_000
scale = 0.5

[sweep.train.learning_rate]
distribution = log_normal
min = 0.001
max = 0.03
mean = 0.01
scale = 0.5

[sweep.train.gamma]
distribution = log_normal
min = 0.95
max = 0.999
mean = 0.98
scale = auto

[sweep.train.gae_lambda]
distribution = log_normal
min = 0.8
max = 0.99
mean = 0.95
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.005
max = 0.02
mean = 0.01
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.1
max = 0.3
mean = 0.2
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.5
max = 4.0
mean = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 2.0
mean = 1.0
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 65536
max = 131072
mean = 131072
scale = auto

[sweep.env.completion_reward]
distribution = uniform
min = 20.0
max = 100.0
mean = 50.0
scale = auto

[sweep.env.monster_kill_reward]
distribution = uniform
min = 1.0
max = 10.0
mean = 5.0
scale = auto

[sweep.env.death_penalty]
distribution = uniform
min = -5.0
max = 0.0
mean = 0.0
scale = auto

[sweep.env.town_stat_increase_reward]
distribution = uniform
min = 0.5
max = 2.0
mean = 1.0
scale = auto

[sweep.env.town_ilvl_increase_reward]
distribution = uniform
min = 1.0
max = 4.0
mean = 2.0
scale = auto

[sweep.env.town_stat_decrease_penalty]
distribution = uniform
min = -2.0
max = -0.5
mean = -1.0
scale = auto

[sweep.env.town_ilvl_decrease_penalty]
distribution = uniform
min = -4.0
max = -1.0
mean = -2.0
scale = auto

[sweep.env.town_no_purchases_penalty]
distribution = uniform
min = -10.0
max = -2.0
mean = -5.0
scale = auto

[sweep.env.low_health_penalty]
distribution = uniform
min = -5.0
max = -1.0
mean = -2.0
scale = auto

[sweep.env.episode_length_limit]
distribution = uniform
min = 10000
max = 100000
mean = 25000
scale = auto