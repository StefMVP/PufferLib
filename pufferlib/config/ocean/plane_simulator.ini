[base]
package = ocean
env_name = puffer_plane_simulator
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 8

[env]
num_envs = 1024
mode = takeoff
wind_speed = 0.0
wind_direction = 0.0

[policy]
hidden_size = 64

[rnn]
input_size = 64
hidden_size = 64

[train]
total_timesteps = 100_000_000
vf_coef = 2
adam_eps = 1e-8
ent_coef = 0.01
anneal_lr = true
clip_coef = 0.2
optimizer = muon
precision = float32
adam_beta1 = 0.9
adam_beta2 = 0.999
batch_size = auto
gae_lambda = 0.95
prio_alpha = 0.85
prio_beta0 = 0.85
bptt_horizon = 64
entropy_coef = 0.1
vf_clip_coef = 0.2
learning_rate = 0.01
compile_mode = max-autotune-no-cudagraphs
max_grad_norm = 1
update_epochs = 4
vtrace_c_clip = 1
minibatch_size = 32768
vtrace_rho_clip = 1
compile_fullgraph = true
max_minibatch_size = 32768
checkpoint_interval = 200
torch_deterministic = True
gamma = 0.98